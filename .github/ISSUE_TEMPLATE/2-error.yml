name: Report an error
description: Something in the specification is wrong, unclear or inconsistent.
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the text if you can.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: A section number, a link to the page on the website, or a file name.
      placeholder: e.g. 4.2, or Field Device Profile.json
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should it say?
      description: Your suggested correction, if you have one.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I've searched the existing issues and this hasn't been reported before.
          required: true
